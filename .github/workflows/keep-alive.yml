# Keep CertGen awake by pinging the Render backend health endpoint every 14 minutes.
# RENDER_BACKEND_URL must be set as a GitHub repository secret.

name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Print UTC time
        run: date -u

      - name: Ping backend health endpoint
        run: |
          curl -L --max-time 30 -w "\nHTTP Status: %{http_code}\n" "${{ secrets.RENDER_BACKEND_URL }}/health" || true