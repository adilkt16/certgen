name: Security Checks

# Run nightly scans at 02:00 UTC and allow manual dispatch.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  pip-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit (fail on HIGH or above)
        # This will fail the workflow if pip-audit finds HIGH+ severity issues
        run: |
          set -e
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt --fail-on high
          else
            echo 'No backend/requirements.txt found — skipping pip-audit';
          fi

  secret-scan:
    name: Repository secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v8
        with:
          # redact sensitive matches in the log output
          args: --repo-path=. --redact
