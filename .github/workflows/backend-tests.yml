name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r certgen/backend/requirements.txt
          pip install pytest

      - name: Run tests (default)
        working-directory: certgen/backend
        run: pytest -q tests/test_limiter_proxy.py

      - name: Run tests (proxy enabled)
        working-directory: certgen/backend
        env:
          USE_PROXY_HEADERS: 'true'
        run: pytest -q tests/test_limiter_proxy.py
